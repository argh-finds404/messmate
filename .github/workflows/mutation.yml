name: Mutation Testing

on:
  workflow_dispatch:

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mutation.txt

      - name: Run mutmut
        run: |
          mutmut run
          mutmut results
