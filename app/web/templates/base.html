<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>messmate</title>
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 1rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; }
    form.inline { display: inline; }
    .flash { padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; }
    .flash.success { background: #e3f6e3; }
    .flash.error { background: #fbe3e3; }
    label { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/members">Members</a>
    <a href="/meals">Meals</a>
    <a href="/expenses">Expenses</a>
    <a href="/billing">Billing</a>
    <a href="/payments">Payments</a>
  </nav>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
